<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Name}} - Groupie Tracker Geolocalization</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <h1>{{.Name}}</h1>
        <a href="/" class="back-link">Back to Home</a>
    </header>
    <div class="artist-detail">
        <div class="artist-info">
            {{if .Image}}
            <img src="{{.Image}}" alt="{{.Name}} Image">
            {{end}}
            <p><strong>Created:</strong> {{.Year}}</p>
            <p><strong>Album:</strong> {{.Album}}</p>
            <p><strong>Members:</strong> {{range .Members}}{{.}}, {{end}}</p>
        </div>
        <h2>Concerts</h2>
        {{if .Concerts}}
        <div class="concerts-table-container">
            <table class="concerts-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>City</th>
                        <th>Country</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .Concerts}}
                    <tr>
                        <td>{{.Date}}</td>
                        <td>{{.City}}</td>
                        <td>{{.Country}}</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
        {{else}}
        <p>No concerts available.</p>
        {{end}}
    </div>

    <div id="map"></div>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        var map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var markers = {{.Markers }};
        if (markers && markers.length > 0) {
            var bounds = [];
            markers.forEach(function (marker) {
                var m = L.marker([marker.lat, marker.lng]).addTo(map);
                m.bindPopup("<b>" + marker.title + "</b>");
                bounds.push([marker.lat, marker.lng]);
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds);
            }
        }
    </script>
</body>

</html>
